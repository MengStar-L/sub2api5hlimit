name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, build, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const tag = process.env.RELEASE_TAG ?? ''
          const match = tag.match(/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/)
          const invalidNumericPrerelease = match?.[4]
            ?.split('.')
            .some(identifier => /^\d+$/.test(identifier) && identifier.length > 1 && identifier.startsWith('0'))
          if (!match || invalidNumericPrerelease) {
            console.error(`Tag ${JSON.stringify(tag)} must be a strict SemVer tag without build metadata, such as v1.2.3 or v1.2.3-rc.1`)
            process.exit(1)
          }
          console.log(`Validated release tag ${tag}`)
          NODE

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Type-check frontend
        run: npm --prefix web run typecheck

      - name: Test frontend
        run: npm --prefix web run test

      - name: Build embedded frontend
        run: npm --prefix web run build

      - name: Test Go packages
        run: go test ./...

      - name: Race-test Go packages
        run: go test -race ./...

      - name: Vet Go packages
        run: go vet ./...

      - name: Install Playwright Chromium
        run: npx --prefix web playwright install --with-deps chromium

      - name: Test browser flows against mocked APIs
        run: npm --prefix web run test:e2e

      - name: Test browser flows against production Go binary
        run: npm --prefix web run test:e2e:production

      - name: Verify systemd units
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo groupadd --system sub2api-limit-portal 2>/dev/null || true
          id sub2api-limit-portal >/dev/null 2>&1 || \
            sudo useradd --system --gid sub2api-limit-portal --no-create-home sub2api-limit-portal
          sudo install -d -m 0755 /opt/sub2api5hlimit/bin
          sudo install -d -m 0750 -o sub2api-limit-portal -g sub2api-limit-portal /opt/sub2api5hlimit/data
          sudo install -d -m 0750 -o root -g sub2api-limit-portal /opt/sub2api5hlimit/config /opt/sub2api5hlimit/update
          sudo install -d -m 0700 /opt/sub2api5hlimit/backups
          sudo install -m 0755 /bin/true /opt/sub2api5hlimit/bin/sub2api-limit-portal
          sudo install -m 0755 /bin/true /opt/sub2api5hlimit/bin/sub2api-limit-updater
          printf 'SUB2API_LIMIT_LISTEN=0.0.0.0:2556\n' | \
            sudo tee /opt/sub2api5hlimit/config/sub2api-limit-portal.env >/dev/null
          systemd-analyze verify \
            packaging/sub2api-limit-portal.service \
            packaging/sub2api-limit-portal-update.service \
            packaging/sub2api-limit-portal-update.path
          sudo rm -rf --one-file-system /opt/sub2api5hlimit

      - name: Build and package Linux releases
        shell: bash
        run: |
          set -Eeuo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          source_date_epoch="$(git log -1 --format=%ct)"
          release_dir="$(mktemp -d "${RUNNER_TEMP}/sub2api-release.XXXXXXXX")"
          stage_dir="${release_dir}/stage"
          assets_dir="${release_dir}/assets"
          mkdir -p "${stage_dir}" "${assets_dir}"

          for arch in amd64 arm64; do
            package="sub2api5hlimit-${tag}-linux-${arch}"
            package_root="${stage_dir}/${package}"
            portal_binary="sub2api-limit-portal-linux-${arch}"
            updater_binary="sub2api-limit-updater-linux-${arch}"
            archive="${assets_dir}/${package}.tar.gz"

            mkdir -p "${package_root}/dist"
            cp -a packaging scripts "${package_root}/"
            install -m 0644 README.md SECURITY.md "${package_root}/"
            chmod 0755 "${package_root}/scripts/install.sh" "${package_root}/scripts/uninstall.sh"

            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "${package_root}/dist/${portal_binary}" ./cmd/sub2api-limit-portal
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "${package_root}/dist/${updater_binary}" ./cmd/sub2api-limit-updater

            test -s "${package_root}/dist/${portal_binary}"
            test -s "${package_root}/dist/${updater_binary}"

            tar --sort=name --mtime="@${source_date_epoch}" --owner=0 --group=0 --numeric-owner \
              -C "${stage_dir}" -czf "${archive}" "${package}"

            archive_contents="$(tar -tzf "${archive}")"
            for required_path in \
              "${package}/dist/${portal_binary}" \
              "${package}/dist/${updater_binary}" \
              "${package}/packaging/sub2api-limit-portal.service" \
              "${package}/packaging/sub2api-limit-portal-update.service" \
              "${package}/packaging/sub2api-limit-portal-update.path" \
              "${package}/packaging/nginx-sub2api-limit-portal.conf" \
              "${package}/scripts/install.sh" \
              "${package}/scripts/uninstall.sh" \
              "${package}/README.md" \
              "${package}/SECURITY.md"; do
              grep -Fxq "${required_path}" <<<"${archive_contents}"
            done
          done

          cd "${assets_dir}"
          archives=(
            "sub2api5hlimit-${tag}-linux-amd64.tar.gz"
            "sub2api5hlimit-${tag}-linux-arm64.tar.gz"
          )
          sha256sum "${archives[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
          RELEASE_VERSION="${version}" node <<'NODE'
          const fs = require('node:fs')
          const policy = JSON.parse(fs.readFileSync(
            `${process.env.GITHUB_WORKSPACE}/packaging/update-policy.json`, 'utf8'))
          const policyKeys = ['min_updater_version', 'mode']
          if (JSON.stringify(Object.keys(policy).sort()) !== JSON.stringify(policyKeys) ||
              !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(policy.min_updater_version) ||
              !['binary', 'manual'].includes(policy.mode)) {
            throw new Error(`invalid packaging/update-policy.json: ${JSON.stringify(policy)}`)
          }
          const manifest = {
            schema: 1,
            version: process.env.RELEASE_VERSION,
            min_updater_version: policy.min_updater_version,
            mode: policy.mode,
          }
          fs.writeFileSync('update-manifest.json', `${JSON.stringify(manifest, null, 2)}\n`, { mode: 0o644 })
          const decoded = JSON.parse(fs.readFileSync('update-manifest.json', 'utf8'))
          const expectedKeys = ['min_updater_version', 'mode', 'schema', 'version']
          const actualKeys = Object.keys(decoded).sort()
          if (JSON.stringify(actualKeys) !== JSON.stringify(expectedKeys) ||
              decoded.schema !== 1 || decoded.version !== process.env.RELEASE_VERSION ||
              decoded.min_updater_version !== policy.min_updater_version || decoded.mode !== policy.mode) {
            throw new Error(`invalid update manifest: ${JSON.stringify(decoded)}`)
          }
          NODE
          test "$(wc -l < SHA256SUMS)" -eq 2
          printf 'RELEASE_ASSETS_DIR=%s\n' "${assets_dir}" >> "${GITHUB_ENV}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          release_args=(
            release create "${GITHUB_REF_NAME}"
            "${RELEASE_ASSETS_DIR}/sub2api5hlimit-${GITHUB_REF_NAME}-linux-amd64.tar.gz"
            "${RELEASE_ASSETS_DIR}/sub2api5hlimit-${GITHUB_REF_NAME}-linux-arm64.tar.gz"
            "${RELEASE_ASSETS_DIR}/SHA256SUMS"
            "${RELEASE_ASSETS_DIR}/update-manifest.json"
            --verify-tag
            --title "${GITHUB_REF_NAME}"
            --generate-notes
          )
          version_without_build="${GITHUB_REF_NAME%%+*}"
          if [[ "${version_without_build}" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh "${release_args[@]}"
